<!DOCTYPE html>
<html>
<head>
    <title>Sauti Tamu CRM</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <script src="config.js"></script>
    <script src="supabase.js"></script>

    <link rel="stylesheet" href="styles.css">

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#111;
            color:white;
            padding:20px;
        }

        h1{
            color:#f4c542;
        }

        .card{
            background:#1a1a1a;
            padding:15px;
            margin-bottom:20px;
            border-radius:10px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th,td{
            border:1px solid #333;
            padding:10px;
            text-align:left;
        }

        th{
            background:#222;
        }

        button{
            padding:8px 12px;
            margin:2px;
            cursor:pointer;
            border:none;
            border-radius:5px;
        }

        .contacted{
            background:orange;
            color:white;
        }

        .registered{
            background:green;
            color:white;
        }

        .whatsapp{
            background:#25D366;
            color:white;
        }

        input{
            width:100%;
            padding:10px;
            margin-bottom:15px;
            border-radius:5px;
            border:none;
        }
    </style>

</head>
<body>

<h1>🎵 Sauti Tamu CRM</h1>

<div class="card" id="stats">
Loading...
</div>

<input
type="text"
id="search"
placeholder="Search lead by name..."
>

<table>

<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Interest</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="leadsTable">

</tbody>

</table>

<script src="crm.js?v=999"></script>

</body>
</html>
