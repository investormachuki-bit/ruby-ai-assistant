
<!DOCTYPE html>
<html>
<head>
  <title>Ruby Flow Builder</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f4f4f4;
    }

    .toolbar {
      padding: 10px;
      background: white;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
    }

    button {
      padding: 10px;
      margin-right: 10px;
    }

    #canvas {
      margin-top: 70px;
      width: 100%;
      height: 100vh;
      position: relative;
    }

    .node {
      width: 180px;
      padding: 15px;
      background: white;
      border: 2px solid #333;
      border-radius: 8px;
      position: absolute;
      cursor: move;
    }
  </style>
</head>
<body><div class="toolbar">
  <button id="addMessage">Add Message</button>
  <button id="addQuestion">Add Question</button>
  <button id="addCondition">Add Condition</button>
  <button id="addEnd">Add End</button>
  <button id="saveFlow">Save Flow</button>
  <button id="loadFlow">Load Flow</button>
</div>

<div id="app"></div>

<script src="flow-builder.js"></script>

</body>
</html>
